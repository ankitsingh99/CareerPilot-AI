[project]
name = "ai-job-search"
version = "1.2.0"
description = "Universal AI Job Search & Application Automation Framework"
readme = "README.md"
requires-python = ">=3.15"
authors = [
    { name = "Ankit Kumar Singh" }
]
dependencies = [
    "playwright>=1.40.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "typing_extensions>=4.10.0",
    "six>=1.16.0",
    "numpy>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
